<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости</title>
    <!-- Подключение CSS файла. Если у вас нет отдельного файла, стили можно будет добавить сюда же -->
    <link rel="stylesheet" href="styles.css">
    <!-- Подключение библиотеки Font Awesome для иконок (рекомендуется) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header>
    <h1>Лента новостей</h1>
    <!-- Кнопка для переключения темы -->
    <button class="theme-toggle-button" aria-label="Переключить тему">
        <i class="fas fa-sun"></i> <!-- Иконка по умолчанию (солнце) -->
    </button>
</header>

<main id="news-container">
    <!-- Этот блок будет динамически заполняться новостями из JSON -->
    <p>Загрузка новостей...</p>
</main>

<footer>
    <p>© 2026 Все права защищены</p>
</footer>

<script>
    // --- Часть 1: Скрипт для переключения темы ---

    // Находим кнопку переключения темы по её классу
    const themeToggleButton = document.querySelector('.theme-toggle-button');

    // Функция для применения выбранной темы (темной или светлой)
    function applyTheme(theme) {
        // Удаляем предыдущие классы тем, чтобы избежать конфликтов
        document.body.classList.remove('light-theme', 'dark-theme');
        // Добавляем класс для новой темы
        document.body.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');

        // Сохраняем выбор пользователя в локальное хранилище браузера
        localStorage.setItem('theme', theme);
    }

    // Получаем сохраненную тему из localStorage или устанавливаем 'light' (светлую) по умолчанию
    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme); // Применяем загруженную или тему по умолчанию

    // Добавляем слушатель события клика на кнопку переключения темы
    themeToggleButton.addEventListener('click', () => {
        // Определяем текущую тему
        const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
        // Определяем новую тему (обратную текущей)
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme); // Применяем новую тему

        // Обновляем иконку на кнопке для наглядности
        const themeIcon = themeToggleButton.querySelector('i');
        if (themeIcon) {
            if (newTheme === 'dark') {
                themeIcon.classList.remove('fa-sun'); // Убираем иконку солнца
                themeIcon.classList.add('fa-moon');  // Ставим иконку луны
            } else {
                themeIcon.classList.remove('fa-moon'); // Убираем иконку луны
                themeIcon.classList.add('fa-sun');  // Ставим иконку солнца
            }
        }
    });

    // --- Часть 2: Скрипт для загрузки и отображения новостей из JSON ---

    // Указываем путь к файлу JSON с новостями. Убедитесь, что файл news.json находится в корне вашего веб-сервера.
    const newsApiUrl = 'news.json';

    // Асинхронная функция для получения и отображения новостей
    async function fetchAndDisplayNews() {
        // Находим контейнер, куда будут добавлены статьи новостей
        const newsContainer = document.getElementById('news-container');

        // Проверка: если контейнер не найден, выводим ошибку в консоль и прекращаем выполнение
        if (!newsContainer) {
            console.error('Элемент с id "news-container" не найден. Проверьте ваш HTML.');
            return;
        }

        try {
            // Отправляем запрос к JSON файлу
            const response = await fetch(newsApiUrl);
            // Если ответ сервера не успешен (например, 404 Not Found), выбрасываем ошибку
            if (!response.ok) {
                throw new Error(`Ошибка HTTP: ${response.status} - ${response.statusText}`);
            }
            // Преобразуем ответ в объект JavaScript (JSON парсинг)
            const newsData = await response.json();

            // Очищаем контейнер от предыдущего содержимого (например, "Загрузка новостей...")
            newsContainer.innerHTML = '';

            // Перебираем каждую новость в полученном массиве
            newsData.forEach(article => {
                // Создаем новый элемент div для каждой статьи
                const articleElement = document.createElement('div');
                articleElement.classList.add('news-article'); // Добавляем CSS класс для стилизации

                // Заполняем созданный элемент HTML-структурой новости
                articleElement.innerHTML = `
                    <h3>${article.title}</h3>
                    <p class="news-date">${article.date}</p>
                    <p>${article.summary}</p>
                    <a href="${article.link}" target="_blank" class="news-link">Читать полностью</a>
                `;
                // Добавляем созданную статью в контейнер на странице
                newsContainer.appendChild(articleElement);
            });
        } catch (error) {
            // В случае ошибки (сетевой, парсинга JSON и т.д.) выводим сообщение пользователю
            console.error('Не удалось загрузить новости:', error);
            newsContainer.innerHTML = '<p>Извините, произошла ошибка при загрузке новостей. Попробуйте обновить страницу позже.</p>';
        }
    }

    // Вызываем функцию fetchAndDisplayNews сразу после того, как весь HTML документ будет загружен и разобран
    document.addEventListener('DOMContentLoaded', fetchAndDisplayNews);
</script>

    #news-container {

    }

      color: var(--link-color);
      text-decoration: none;
      font-weight: bold;
    }

    .news-link:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 2rem;
      border-top: 1px solid var(--border-color);
    }

    Также создайте файл news.json в той же директории, что и HTML, со следующим содержимым:

    [
      {
        "title": "Встречайте новую версию нашего приложения!",

-->
</body>
</html>
