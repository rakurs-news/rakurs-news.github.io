<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ракурс NEWS — ироничные новости с экспертным взглядом</title>

    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/logo.png">

    <!-- Мета для соцсетей -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rakurs-news.github.io/rakurs-news/">
    <meta property="og:title" content="Ракурс NEWS">
    <meta property="og:description" content="Свежие новости с иронией. Вся правда в иронии">
    <meta property="og:image" content="images/logo.png"> 
    
    <meta name="description" content="Ракурс NEWS: Ироничный взгляд на главные новости политики, общества и мира. Раскрываем правду через сарказм и острый анализ">
    
    <!-- ПОДКЛЮЧЕНИЕ ВНЕШНЕГО CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --header-height: 60px;
        }

        /* --- ЭТОТ БЛОК ГАРАНТИРУЕТ СКРОЛЛ --- */
        .categories-wrapper {
            display: flex;
            flex-wrap: nowrap;       /* Кнопки в одну строку */
            overflow-x: auto;        /* Горизонтальный скролл */
            scrollbar-width: none;   /* Firefox */
        }
        .categories-wrapper::-webkit-scrollbar {
            display: none;           /* Chrome/Safari */
        }
        .category-btn {
            flex: 0 0 auto;          /* Кнопки не сжимаются */
            white-space: nowrap;     /* Текст не переносится */
            min-width: 130px;        /* Фиксированная ширина, чтобы вылезало за экран */
            padding: 8px 12px;       /* Чуть воздуха внутри кнопки */
        }
        /* ------------------------------------- */
    </style>
</head>
<body>
    <h1 style="display: none;">Актуальные новости Ракурс NEWS</h1>
    
    <div id="progress-bar"></div>

    <header>
        <div class="logo-wrapper">
            <img src="images/logo.png" alt="Logo">
            <span id="logo-text">Ракурс NEWS</span>
        </div>
        <div class="controls-wrapper">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск...">
                <div id="search-results"></div>
            </div>
            <button class="theme-toggle" aria-label="Сменить тему">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- ПАНЕЛЬ КАТЕГОРИЙ -->
    <!-- ПАНЕЛЬ КАТЕГОРИЙ (ПОЛНОСТЬЮ ЗАМЕНИТЬ СТАРЫЙ БЛОК) -->
<div class="categories-panel" style="width: 100%; overflow: hidden;">
    <div class="categories-wrapper" id="menu" 
         style="display: flex; flex-wrap: nowrap; gap: 12px; overflow-x: auto; scrollbar-width: none;">
        
        <button class="category-btn" data-category="all" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Все новости</button>
        <button class="category-btn" data-category="СВО" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">СВО</button>
        <button class="category-btn" data-category="Общество" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Общество</button>
        <button class="category-btn" data-category="Регионы" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Регионы</button>
        <button class="category-btn" data-category="Государство" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Государство</button>
        <button class="category-btn" data-category="Происшествия" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Происшествия</button>
        <button class="category-btn" data-category="Криминал" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Криминал</button>
        <button class="category-btn" data-category="Политика" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Политика</button>
        <button class="category-btn" data-category="Геополитика" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Геополитика</button>
        <button class="category-btn" data-category="Коррупция" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Коррупция</button>
        <button class="category-btn" data-category="Шоу-бизнес" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Шоу-бизнес</button>
        <button class="category-btn" data-category="Спорт" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Спорт</button>
        <button class="category-btn" data-category="Наука" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Наука</button>
        <button class="category-btn" data-category="Стиль" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Стиль</button>
        <button class="category-btn" data-category="Культура" style="flex: 0 0 auto; white-space: nowrap; min-width: 130px; padding: 8px 12px;">Культура</button>
    </div>
</div>
<!-- КОНЕЦ ПАНЕЛИ -->

    <div id="top-scroll-indicator" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 4px;
        background: var(--accent);
        z-index: 2001;
    "></div>

    <div id="loader" style="text-align:center; padding: 20px;">Загрузка новостей...</div>
    <div id="main-news" class="featured-news" style="display: none;"></div>
    <div id="news-container" class="news-grid" style="padding-bottom: 80px;"></div>

    <button id="scrollToTop" onclick="scrollToTop()" aria-label="Вернуться наверх" role="button">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: auto;">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <div class="floating-buttons" id="floatingButtons">
        <a href="https://vk.ru/rakurs_news" target="_blank"><img src="images/VK.png" alt="VK"></a>
        <a href="https://t.me/RAKURS_NEWS_RU" target="_blank"><img src="images/Telegram.png" alt="Telegram"></a>
    </div>

    <div class="footer">
        <div class="social-icons">
            <a href="https://vk.ru/rakurs_news" target="_blank"><img src="images/VK.png" alt="VK"></a>
            <a href="https://t.me/RAKURS_NEWS_RU" target="_blank"><img src="images/Telegram.png" alt="Telegram"></a>
        </div>
    </div>

    <!-- ВАШ СКРИПТ ДЛЯ СКРОЛЛА (перед основным script.js) -->
        <!-- СКРИПТ ДЛЯ СКРОЛЛА КОЛЕСИКОМ -->
        <script>
            const wrapper = document.getElementById('menu');
            if (wrapper) {
                wrapper.addEventListener('wheel', (e) => {
                    // Если крутим колесико — двигаем скролл горизонтально
                    if (e.deltaX !== 0 || e.deltaY !== 0) {
                        e.preventDefault(); // Блокируем обычный скролл страницы
                        const delta = e.deltaX || e.deltaY;
                        wrapper.scrollLeft += delta;
                    }
                }, { passive: false });
            }
        </script>
    
        <!-- ПОДКЛЮЧЕНИЕ ВНЕШНЕГО JS -->
        <script src="script.js" defer></script>
    </body>
    </html>
