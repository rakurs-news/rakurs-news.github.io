<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ракурс NEWS — ироничные новости с экспертным взглядом</title>

    <!-- Иконка -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Мета для соцсетей -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rakurs-news.github.io/rakurs-news/">
    <meta property="og:title" content="Ракурс NEWS">
    <meta property="og:description" content="Свежие новости с иронией. Вся правда в иронии">
    <meta property="og:image" content="images/logo.png"> 

    <meta name="description" content="Ракурс NEWS: Ироничный взгляд на главные новости политики, общества и мира.">
    
    <!-- ПОДКЛЮЧЕНИЕ СТИЛЕЙ -->
    <!-- Путь относительный, так как index.html лежит в корне -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Дополнительные стили специально для главной страницы */
        .featured-news-card {
            margin-bottom: 30px;
            border-left: 5px solid var(--accent);
        }
        
        /* Анимация появления карточек */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .news-card.loaded {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>
    <h1 style="display: none;">Актуальные новости Ракурс NEWS</h1>
    
    <div id="progress-bar"></div>

    <header>
        <div class="logo-wrapper">
            <img src="images/logo.png" alt="Logo">
            <span id="logo-text">Ракурс NEWS</span>
        </div>
        <div class="controls-wrapper">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск...">
                <div id="search-results"></div>
            </div>
            <button class="theme-toggle" aria-label="Сменить тему">
                <!-- SVG иконки темы (упрощенная версия) -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- ПАНЕЛЬ КАТЕГОРИЙ -->
    <div class="categories-panel">
        <div class="categories-wrapper" id="menu">
            <button class="category-btn active" data-category="all">Все новости</button>
            <!-- Категории должны совпадать с теми, что в news.json -->
            <button class="category-btn" data-category="сво">СВО</button>
            <button class="category-btn" data-category="общество">Общество</button>
            <button class="category-btn" data-category="технологии">Технологии</button> 
            <!-- Добавь остальные кнопки по аналогии с твоим JSON -->
        </div>
    </div>

    <div id="top-scroll-indicator" style="position: fixed; top: 0; left: 0; width: 0%; height: 4px; background: var(--accent); z-index: 2001;"></div>

    <div id="loader" style="text-align:center; padding: 40px; font-size: 18px;">Загрузка новостей...</div>
    
    <!-- Блок для главной новости (если есть featured) -->
    <div id="main-news" class="featured-news" style="display: none;"></div>
    
    <!-- Сетка новостей -->
    <div id="news-container" class="news-grid" style="padding-bottom: 80px;"></div>

    <!-- ПАГИНАЦИЯ -->
    <nav aria-label="Навигация по страницам новостей" class="pagination-wrapper" id="pagination-controls">
        <!-- Кнопки будут добавлены через JS -->
    </nav>

    <button id="scrollToTop" onclick="scrollToTop()" aria-label="Вернуться наверх">
        <svg width="24" height="24"><polyline points="12 19 12 5 5 12 19 12"/></svg>
    </button>

    <div class="floating-buttons" id="floatingButtons">
        <a href="https://vk.ru/rakurs_news" target="_blank"><img src="images/VK.png" alt="VK"></a>
        <a href="https://t.me/RAKURS_NEWS_RU" target="_blank"><img src="images/Telegram.png" alt="Telegram"></a>
    </div>

    <div class="footer">
        <div class="social-icons">
            <a href="https://vk.ru/rakurs_news"><img src="images/VK.png" alt="VK"></a>
            <a href="https://t.me/RAKURS_NEWS_RU"><img src="images/Telegram.png" alt="Telegram"></a>
        </div>
    </div>

    <script>
        // --- ЛОГИКА ЗАГРУЗКИ И ОТОБРАЖЕНИЯ ---
        const categoriesPanel = document.querySelector('.categories-panel');
        let isHovering = false;

        const onWheel = (e) => {
            e.preventDefault();
            categoriesPanel.scrollLeft += e.deltaY;
        };

        categoriesPanel.addEventListener('mouseenter', () => {
            isHovering = true;
            categoriesPanel.addEventListener('wheel', onWheel, { passive: false });
        });
        categoriesPanel.addEventListener('mouseleave', () => {
            isHovering = false;
            categoriesPanel.removeEventListener('wheel', onWheel);
        });

        // Переменные состояния
        let allNews = [];
        let currentCategory = 'all';
        const itemsPerPage = 12;
        const newsContainer = document.getElementById('news-container');
        const loader = document.getElementById('loader');

        // Функция форматирования даты
        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('ru-RU', options);
        }

        // Рендер одной карточки
        function renderCard(newsItem) {
    const catClass = `category-${newsItem.category}`;
    
    const card = document.createElement('div');
    card.className = 'news-card card';
    card.style.opacity = 0;
    
    // ВОТ ЗДЕСЬ МЫ ТЕПЕРЬ ВСЕГДА СТАВИМ КАРТИНКУ ИЗ JSON
    card.innerHTML = `
        <a href="/news/${newsItem.slug}/" class="news-link" style="text-decoration: none; color: inherit;">
            <!-- Реальная картинка из JSON -->
            <img src="${newsItem.image}" alt="${newsItem.title}" class="news-image">
            
            <div class="news-content">
                <span class="news-category-badge ${catClass}">${newsItem.category}</span>
                
                <div class="meta-container" style="margin-bottom:10px; font-size:12px; color:var(--meta);">
                    <span class="meta-date" style="color:var(--accent); font-weight:bold;">${formatDate(newsItem.date)}</span>
                </div>

                <h3 class="news-title">${newsItem.title}</h3>
                <p class="news-description">${newsItem.summary}</p>
                
                <span class="read-more" style="margin-top:auto;">Читать далее →</span>
            </div>
        </a>
    `;
    
    setTimeout(() => {
        card.classList.add('loaded');
    }, 50 * Array.from(newsContainer.children).length);

    return card;
}


        // Фильтрация и отрисовка
        function updateView() {
            newsContainer.innerHTML = ''; // Очищаем сетку
            
            let filteredNews = allNews;
            if (currentCategory !== 'all') {
                filteredNews = allNews.filter(item => item.category === currentCategory);
            }

            filteredNews.forEach(item => {
                newsContainer.appendChild(renderCard(item));
            });

            renderPagination(1, Math.ceil(filteredNews.length / itemsPerPage));
        }

        // Логика пагинации (твоя старая логика, немного упрощенная)
        function renderPagination(currentPage, totalPages) {
            const paginationControls = document.getElementById('pagination-controls');
            paginationControls.innerHTML = '';
            
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = `pagination-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prevBtn.textContent = '← Назад';
            if (currentPage > 1) prevBtn.onclick = () => loadPage(currentPage - 1);
            paginationControls.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => loadPage(i);
                paginationControls.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = `pagination-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            nextBtn.textContent = 'Вперед →';
            if (currentPage < totalPages) nextBtn.onclick = () => loadPage(currentPage + 1);
            paginationControls.appendChild(nextBtn);
        }

        function loadPage(page) {
             // Эта функция сейчас просто обновляет вид, так как мы рендерим все сразу для простоты.
             // Для реальной пагинации нужно было бы менять логику renderCard, но для старта лучше показать все.
             updateView(); 
        }

        // Загрузка данных
        async function loadNews() {
            try {
                // Пытаемся взять новости из JSON
                const response = await fetch('news.json');
                if (!response.ok) throw new Error('Не удалось загрузить JSON');
                
                allNews = await response.json();
                
                // Скрываем лоадер
                loader.style.display = 'none';
                
                // Обновляем вид
                updateView();

                // Навешиваем обработчики кнопок категорий
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentCategory = e.target.dataset.category;
                        updateView();
                    });
                });

            } catch (error) {
                console.error(error);
                loader.textContent = 'Ошибка загрузки новостей. Проверьте news.json';
                loader.style.color = 'red';
            }
        }

        loadNews();

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Кнопка смены темы
        document.querySelector('.theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
