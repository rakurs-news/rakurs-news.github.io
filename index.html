<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta для SEO -->
    <title>Ракурс NEWS | Экспертный разбор новостей простым языком</title>
    <meta name="description" content="Ракурс NEWS: профессиональный разбор официальных новостей. Аналитика, СВО, политика, армия и геополитика простым языком.">
    <meta name="keywords" content="новости, аналитика, разбор новостей, Ракурс, политика, СВО, армия">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph для соцсетей -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ракурс NEWS — Экспертный разбор новостей">

    <meta property="og:site_name" content="Ракурс NEWS">

    <!-- Подключение стилей и скриптов -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="header-container">
            <!-- Логотип -->
            <div class="logo-wrapper">
                <img src="images/logo.png" alt="Логотип Ракурс NEWS" class="logo-img">
                <span class="site-title">Ракурс NEWS</span>
            </div>

            <!-- Поле поиска -->
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Поиск..." class="search-input">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>

            <!-- Кнопка бургера -->
            <button class="burger-btn" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Мобильное меню (боковая панель) -->
    <nav class="mobile-menu">
        <ul class="menu-list">
            <li><a href="#" class="menu-link">СВО</a></li>
            <li><a href="#" class="menu-link">Армия</a></li>

            <li><a href="#" class="menu-link">Криминал</a></li>

    </nav>

    <!-- Основной контент -->
    <main class="content-area">
        <div id="news-container" class="news-grid">
            <!-- Карточки будут добавлены через JS -->
        </div>
        
        <div id="loader" class="loader">Загрузка...</div>
    </main>

    <!-- Футер -->
    <footer class="site-footer">
        <div class="footer-content">
            <p class="copyright">© 2026 Ракурс NEWS. Все права защищены</p>
            
            <div class="socials-section">
                <p class="socials-title">Наши соцсети</p>
                
                <div class="social-item">
                    <!-- Иконка Телеграм -->
                    <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2H2a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h20a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-13.5 15l-1-1l-3.5-3.5l1.5-1.5L11 13l3.5 3.5l4-4l1.5 1.5L10.5 17l-2 2z"></path>
