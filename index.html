    </div>

  <script src="news-data.js"></script>
  <script>
    // ===== ГЛАВНАЯ СТРАНИЦА — ЛОГИКА =====
    document.addEventListener('DOMContentLoaded', () => {
      const heroSection = document.getElementById('heroSection');
      const grid = document.getElementById('newsGrid');
      const gridTitle = document.getElementById('gridTitle');
      const burger = document.getElementById('burger');
      const mobileMenu = document.getElementById('mobileMenu');
      let currentCat = 'all';

      // ===== РЕНДЕР HERO =====
      function renderHero() {
        const sorted = sortByDate(news);
        const main = sorted[0];
        const sideCats = ['Армия', 'Экономика', 'Спорт'];
        const sideCards = sideCats
          .map(c => sorted.find(n => n.cat === c))
          .filter(Boolean)
          .slice(0, 3);

        let sideHtml = '';
        sideCards.forEach(n => {
          const img = n.img;
          sideHtml += `
            <a class="hero-side-card" href="${n.link}">
              <span class="badge">${n.cat}</span>
              <img src="${img}" alt="${n.title}">
              <div class="overlay"></div>
              <div class="text"><h3>${n.title}</h3></div>
            </a>`;
        });

        heroSection.innerHTML = `
          <a class="hero-main" href="${main.link}">
            <span class="hero-badge">${main.cat}</span>
            <img src="${main.img}" alt="${main.title}">
            <div class="hero-overlay"></div>
            <div class="hero-content">
              <h2>${main.title}</h2>
              <p>${main.excerpt}</p>
            </div>
          </a>
          <div class="hero-side">${sideHtml}</div>`;
      }

      // ===== РЕНДЕР СЕТКИ =====
      function renderGrid(cat, query) {
        currentCat = cat;
        let filtered = getNewsByCat(cat);

        if (query) {
          const q = query.toLowerCase();
          filtered = filtered.filter(n =>
            n.title.toLowerCase().includes(q) || n.excerpt.toLowerCase().includes(q)
          );
        }

        // === ГЛАВНОЕ ИЗМЕНЕНИЕ ===
        // Если мы на главной (cat === 'all'), показываем только топ-10
        if (cat === 'all') {
          filtered = filtered.slice(0, 10);
        }
        // =========================

        grid.innerHTML = '';
        if (filtered.length === 0) {
          grid.innerHTML = '<div class="empty-state"><p>Новостей пока нет, но они скоро появятся.</p></div>';
          return;
        }

        filtered.forEach((n, i) => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = n.link;
          card.style.animationDelay = (i * 0.06) + 's';
          card.innerHTML = `
            <div class="card-img">
              <span class="card-badge">${n.cat}</span>
              <img src="${n.img}" alt="${n.title}" loading="lazy">
            </div>
            <div class="card-body">
              <h3>${n.title}</h3>
              <p>${n.excerpt}</p>
              <div class="card-meta"><span>${n.date}</span></div>
            </div>`;
          grid.appendChild(card);
        });

        gridTitle.textContent = cat && cat !== 'all' ? cat : 'Все новости';
      }

      renderHero();
      renderGrid('all');

      // ===== БУРГЕР =====
      function closeMobileMenu() {
        burger.classList.remove('open');
        mobileMenu.classList.remove('open');
      }
      burger.addEventListener('click', () => {
        if (burger.classList.contains('open')) closeMobileMenu();
        else { burger.classList.add('open'); mobileMenu.classList.add('open'); }
      });
      document.addEventListener('click', (e) => {
        if (!burger.contains(e.target) && !mobileMenu.contains(e.target)) closeMobileMenu();
      });

      // ===== НАВИГАЦИЯ (категории через href) =====
      document.querySelectorAll('.nav a, .mobile-menu a').forEach(a => {
        a.addEventListener('click', (e) => {
          if (a.hasAttribute('href') && a.dataset.cat !== 'all' && a.dataset.cat !== currentCat) {
            return;
          }
          if (a.dataset.cat === 'all') {
            e.preventDefault();
            renderGrid('all');
            document.querySelectorAll('.nav a, .mobile-menu a').forEach(x => x.classList.remove('active'));
            a.classList.add('active');
            closeMobileMenu();
            window.scrollTo({ top: document.querySelector('.section').offsetTop - 80, behavior: 'smooth' });
          }
        });
      });

      // ===== ПОИСК =====
      const searchInput = document.getElementById('searchInput');
      const mobileSearchInput = document.getElementById('mobileSearchInput');
      searchInput.addEventListener('input', () => renderGrid(currentCat, searchInput.value));
      mobileSearchInput.addEventListener('input', () => renderGrid(currentCat, mobileSearchInput.value));
    });
  </script>
</body>
