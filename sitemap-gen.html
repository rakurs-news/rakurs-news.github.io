<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Генератор sitemap</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      font-family: Arial, sans-serif;
    }
    #gen {
      padding: 14px 28px;
      background: #d63a2f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #gen:hover { background: #b52f26; }
  </style>
</head>
<body>
  <button id="gen">Скачать sitemap.xml</button>
  <script src="news-data.js"></script>
  <script>
    document.getElementById('gen').addEventListener('click', () => {
      const base = 'https://rakurs-news.github.io/';
      const pages = ['', 'v-rossii.html', 'v-mire.html', 'ekonomika.html',
                     'sport.html', 'kultura.html', 'armiya.html'];
      const urls = pages.map(p => '  <url><loc>' + base + p + '</loc></url>');
      (typeof news !== 'undefined' ? news : []).forEach(n => {
        const link = n.link.startsWith('http') ? n.link : base + n.link;
        urls.push('  <url><loc>' + link + '</loc></url>');
      });
      const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
        '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
        urls.join('\n') + '\n</urlset>';
      const blob = new Blob([xml], { type: 'application/xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sitemap.xml';
      a.click();
    });
  </script>
</body>
</html>
