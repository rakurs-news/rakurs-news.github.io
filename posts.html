<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Посты редакции — Ракурс News</title>
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://rakurs-news.github.io/posts.html">
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #17191e;
  --bg-row: #1d2027;
  --bg-raised: #22262e;
  --text: #e6e7ea;
  --text-dim: #8f929c;
  --accent: #d63a2f;
  --accent-soft: rgba(214, 58, 47, 0.12);
  --line: #2c3038;
  --serif: 'PT Serif', Georgia, serif;
  --sans: 'PT Sans', Arial, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.55; }
a { color: inherit; text-decoration: none; }

.header {
  position: sticky; top: 0; z-index: 200;
  height: 60px; background: var(--bg); border-bottom: 3px solid var(--accent);
}
.header-inner {
  max-width: 1160px; height: 100%; margin: 0 auto; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo img { max-height: 36px; width: auto; }
.brand {
  font-family: var(--serif); font-weight: 700; font-size: 21px;
  letter-spacing: .02em; color: #fff;
}
.brand em { font-style: normal; color: var(--accent); }
.p-back {
  font-family: var(--mono); font-size: 12px; text-transform: uppercase;
  letter-spacing: .08em; color: var(--text-dim);
}
.p-back:hover { color: var(--accent); }

.main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
.posts-head-row {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid var(--accent); padding-bottom: 10px;
}
.posts-head-row h2 { font-family: var(--serif); font-size: 26px; color: #fff; }

.post-date-divider { display: flex; align-items: center; gap: 16px; margin: 38px 0 30px; }
.post-date-divider::before, .post-date-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}
.post-date-divider span {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: 20px;
  padding: 7px 20px; font-family: var(--mono); font-size: 12px; font-weight: 700;
  color: var(--accent); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
}
.post-date-divider:first-child { margin-top: 24px; }

.post-card {
  background: var(--bg-row); border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 18px 22px; margin-bottom: 30px;
  opacity: 0; transform: translateY(10px);
  animation: postIn .4s ease forwards;
}
.post-flash { box-shadow: 0 0 0 2px var(--accent) !important; }

/* ===== ФОТО ПОСТА — во всю ширину карточки, над заголовком ===== */
.post-media {
  margin: -18px -22px 14px;
  aspect-ratio: 3/2;
  overflow: hidden;
  background: #0d0e12;
  border-bottom: 1px solid var(--line);
  border-radius: 4px 4px 0 0;
}
.post-media img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

@keyframes postIn { to { opacity: 1; transform: translateY(0); } }
.post-meta { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.post-meta .post-time { color: var(--accent); font-weight: 700; }
.post-card h3 { font-family: var(--serif); font-size: 20px; color: #fff; margin: 0 0 10px; line-height: 1.3; }
.post-body { font-size: 15px; line-height: 1.6; color: var(--text); }
.post-body p { margin: 0 0 10px; }
.post-body b, .post-body strong { color: #fff; }
.post-body a { color: var(--accent); text-decoration: underline; }
.post-body blockquote {
  border-left: 3px solid var(--accent); background: var(--bg);
  margin: 10px 0; padding: 8px 16px; color: var(--text-dim); font-style: italic;
}
.post-body u { text-decoration-color: var(--accent); }
.p-empty { color: var(--text-dim); font-family: var(--mono); font-size: 13px; padding: 30px 0; }

/* ===== ПОДГРУЗКА ===== */
.sentinel {
  padding: 28px 0;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.sentinel.done { display: none; }
.sentinel::after {
  content: '';
  display: block;
  width: 24px;
  height: 24px;
  margin: 12px auto 0;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== КНОПКА НАВЕРХ ===== */
.to-top {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 300;
  width: 48px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--bg-raised);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .25s, transform .25s, visibility .25s, background .15s, color .15s;
}
.to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
.to-top:hover { background: var(--accent); color: #fff; }

@media (max-width: 640px) {
  .brand { font-size: 16px; }
  .logo img { max-height: 28px; }
  .post-card { padding: 14px; margin-bottom: 22px; }
  .post-media { margin: -14px -14px 12px; }
  .post-date-divider { margin: 26px 0 20px; }
}
.posts-head-row h2::before,
.feed-title::before {
  content: '';
  display: inline-block;
  width: 10px;
  height: 10px;
  background: var(--accent);
  margin-right: 12px;
  vertical-align: middle;
}
/* ===== ПЛАШКА «СРОЧНО» ===== */
.post-card h3.has-urgent {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.rn-urgent {
  flex-shrink: 0;
  margin-top: 3px;
  background: var(--accent);
  color: #fff;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 4px 14px;
  white-space: nowrap;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
}
/* ===== ПОИСК ПО ПОСТАМ ===== */
.rn-search { margin: 22px 0 6px; position: relative; }
.rn-search input {
  width: 100%;
  background: var(--bg-row);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 11px 14px 11px 38px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  outline: none;
}
.rn-search input:focus { border-color: var(--accent); }
.rn-search::before {
  content: '\1F50D';
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  opacity: .6;
}
/* ===== ССЫЛКА НА ПОСТ (иконка-цепь) ===== */
.post-share-row {
  text-align: right;
  margin-top: 12px;
}
.rn-share {
  display: inline-flex;
  align-items: center;
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 4px;
}
.rn-share svg {
  width: 20px;
  height: 20px;
  display: block;
}
.rn-share:hover { opacity: .75; }

<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="Ракурс News"></a>
    <a class="brand" href="index.html">РАКУРС <em>NEWS</em></a>
    <a class="p-back" href="index.html">&larr; Все новости</a>
  </div>
</header>

<main class="main">
  <div class="posts-head-row"><h2>Посты редакции</h2></div>
  <div class="rn-search">
    <input type="search" id="postSearch" placeholder="Поиск по постам..." autocomplete="off">
  </div>
  <div id="posts-list"></div>
  <div class="sentinel" id="sentinel">Загружаем ещё</div>
</main>

<button class="to-top" id="toTop" aria-label="Наверх">&#8593;</button>

<script src="posts-data.js"></script>
<script>
(function () {
  var list = document.getElementById('posts-list');
  var sentinel = document.getElementById('sentinel');

  if (typeof POSTS === 'undefined' || !POSTS.length) {
    list.innerHTML = '<p class="p-empty">Постов пока нет.</p>';
    sentinel.classList.add('done');
    return;
  }

  var PAGE_SIZE = 10;   // сколько постов показывать за раз
  var shown = 0;
  var lastDate = null;  // помним дату и между порциями — разделители не задвоятся

  function postHTML(p) {
    var urgent = p.urgent ? '<span class="rn-urgent">Срочно</span>' : '';
    var h3class = p.urgent ? ' class="has-urgent"' : '';
    var media = p.img ? '<div class="post-media"><img src="' + p.img + '" alt="' + (p.title || '').replace(/"/g, '&quot;') + '" loading="lazy"></div>' : '';
    var share = '<button class="rn-share" data-id="' + p.id + '" title="Скопировать ссылку на пост" style="display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:13px;padding:4px;">' +
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(-45deg);">' +
      '<path d="M10.5 13.5a4.5 4.5 0 0 0 6.36 0l3-3a4.5 4.5 0 0 0-6.36-6.36l-1.5 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M13.5 10.5a4.5 4.5 0 0 0-6.36 0l-3 3a4.5 4.5 0 0 0 6.36 6.36l1.5-1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>' +
      '<span>Скопировать ссылку</span>' +
      '</button>';
    return '<article class="post-card" id="post-' + p.id + '">' +
      media +
      '<div class="post-meta"><span class="post-time">' + p.time + ' МСК</span></div>' +
      '<h3' + h3class + '>' + p.title + urgent + '</h3>' +
      '<div class="post-body">' + p.text + '</div>' +
      '<div class="post-share-row" style="text-align:right;margin-top:12px;">' + share + '</div>' +
      '</article>';
  }

  function loadMore() {
    if (searchQuery) return;
    if (shown >= POSTS.length) {
      sentinel.classList.add('done');
      return;
    }
    var chunk = POSTS.slice(shown, shown + PAGE_SIZE);
    var html = '';
    chunk.forEach(function (p) {
      if (p.date !== lastDate) {
        html += '<div class="post-date-divider"><span>' + p.date + '</span></div>';
        lastDate = p.date;
      }
      html += postHTML(p);
    });
    list.insertAdjacentHTML('beforeend', html);
    shown += chunk.length;
    sentinel.classList.toggle('done', shown >= POSTS.length);
  }

  // ===== ПОИСК ПО ПОСТАМ =====
  var searchBox = document.getElementById('postSearch');
  var searchQuery = '';

  function stripTags(s) {
    return (s || '').replace(/<[^>]+>/g, ' ');
  }

  function renderSearch() {
    var q = searchQuery.toLowerCase();
    var matches = POSTS.filter(function (p) {
      return ((p.title || '') + ' ' + stripTags(p.text)).toLowerCase().indexOf(q) !== -1;
    });
    var html = '';
    var d = null;
    if (!matches.length) {
      html = '<p class="p-empty">По запросу «' + searchQuery + '» ничего не найдено.</p>';
    } else {
      matches.forEach(function (p) {
        if (p.date !== d) {
          html += '<div class="post-date-divider"><span>' + p.date + '</span></div>';
          d = p.date;
        }
        html += postHTML(p);
      });
    }
    list.innerHTML = html;
    sentinel.classList.add('done');
  }

  var searchTimer = null;
  searchBox.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      searchQuery = searchBox.value.trim();
      if (!searchQuery) {
        list.innerHTML = '';
        shown = 0;
        lastDate = null;
        sentinel.classList.remove('done');
        loadMore();
      } else {
        renderSearch();
      }
    }, 200);
  });

  var io = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: '500px 0px' });
  io.observe(sentinel);

  loadMore();

  // ===== КОПИРОВАНИЕ ССЫЛКИ НА ПОСТ =====
  list.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.rn-share') : null;
    if (!btn) return;
    var url = location.origin + location.pathname + '#post-' + btn.getAttribute('data-id');
    function done() {
      var old = btn.innerHTML;
      btn.textContent = '\u2713 скопировано';
      setTimeout(function () { btn.innerHTML = old; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      document.body.removeChild(ta);
      done();
    }
  });

  // ===== ПЕРЕХОД К ПОСТУ ПО ССЫЛКЕ =====
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  function scrollToHash() {
    var hash = decodeURIComponent(location.hash);
    if (!hash.startsWith('#post-')) return false;
    // если пост глубже первой порции — дотягиваем ленту, пока он не появится
    var target = document.querySelector(hash);
    var tries = 0;
    while (!target && shown < POSTS.length && tries < 100) {
      loadMore();
      target = document.querySelector(hash);
      tries++;
    }
    if (!target) return false;
    // забираем якорь себе: браузер больше не скроллит к нему сам
    history.replaceState(null, '', location.pathname + location.search);
    var header = document.querySelector('.header');
    var offset = (header ? header.offsetHeight : 0) + 12;
    var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo(0, top);
    target.classList.add('post-flash');
    return true;
  }
  scrollToHash();

  // ===== КНОПКА НАВЕРХ =====
  var btn = document.getElementById('toTop');
  window.addEventListener('scroll', function () {
    btn.classList.toggle('visible', window.scrollY > 600);
  }, { passive: true });
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
