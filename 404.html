<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Ракурс News</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #17191e;
      --bg-row: #1d2027;
      --text: #e6e7ea;
      --text-dim: #8f929c;
      --accent: #d63a2f;
      --line: #2c3038;
      --serif: 'PT Serif', Georgia, serif;
      --sans: 'PT Sans', Arial, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }

    .header { height: 60px; width: 100%; background: var(--bg); border-bottom: 3px solid var(--accent); }
    .header-inner { max-width: 1160px; height: 100%; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
    .logo img { max-height: 36px; width: auto; display: block; }
    .brand { font-family: var(--serif); font-weight: 700; font-size: 21px; letter-spacing: 0.02em; }
    .brand em { font-style: normal; color: var(--accent); }
    .code-tag { font-family: var(--mono); font-size: 13px; color: var(--text-dim); letter-spacing: 0.04em; }

    .main { flex: 1; max-width: 820px; margin: 0 auto; padding: 64px 16px 48px; width: 100%; text-align: center; }
    .error-code {
      font-family: var(--mono); font-weight: 700; font-size: 96px; line-height: 1;
      color: var(--accent); letter-spacing: 0.08em;
    }
    .error-code em { font-style: normal; color: var(--text); }
    h1 { font-family: var(--serif); font-weight: 700; font-size: 28px; line-height: 1.25; color: #fff; margin: 20px 0 12px; }
    .sub { color: var(--text-dim); font-size: 16px; line-height: 1.6; max-width: 480px; margin: 0 auto 32px; }
    .btn {
      display: inline-block; background: var(--accent); color: #fff;
      padding: 13px 30px; font-weight: 700; font-size: 15px; letter-spacing: 0.06em;
      text-transform: uppercase; border-radius: 3px;
    }
    .btn:hover { background: #b92f26; }
    .links { margin-top: 22px; font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
    .links a { color: var(--accent); }
    .links a:hover { text-decoration: underline; }

    .footer { border-top: 3px solid var(--accent); background: var(--bg-row); padding: 30px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }

    @media (max-width: 768px) {
      .error-code { font-size: 72px; }
      h1 { font-size: 22px; }
      .brand { font-size: 16px; }
      .logo img { max-height: 28px; }
      .code-tag { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo" aria-label="Ракурс News — на главную">
        <img src="/img/logo.png" alt="Ракурс News" width="100" height="30">
      </a>
      <div class="brand">РАКУРС <em>NEWS</em></div>
      <div class="code-tag">404</div>
    </div>
  </header>

  <main class="main">
    <div class="error-code">4<em>0</em>4</div>
    <h1>Такой страницы у нас нет</h1>
    <p class="sub">Возможно, ссылка устарела или в адресе опечатка. Свежие новости уже ждут вас на главной.</p>
    <a href="/" class="btn">На главную</a>
    <p class="links">или загляните в рубрики: <a href="/v-rossii.html">В России</a> · <a href="/v-mire.html">В мире</a> · <a href="/ekonomika.html">Экономика</a> · <a href="/sport.html">Спорт</a></p>
  </main>

  <footer class="footer">
    © 2026 Ракурс News — Актуальные новости России и мира
  </footer>
</body>
</html>
