<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{TITLE}}</title>
    <!-- Исправлено: используем baseurl для стилей -->
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
</head>
<body>
    <div class="container">
        <!-- Исправлено: ссылка на главную через baseurl -->
        <a href="{{ site.baseurl }}/" class="back-link">← Вернуться на главную</a>
        
        <article class="post">
            <h1 class="post-title">{{TITLE}}</h1>
            
            <div class="post-meta">
                <span class="category">{{CATEGORY}}</span>
                <span class="date">{{DATE}}</span>
            </div>

            <div class="post-summary">
                {{SUMMARY}}
            </div>

            <div class="post-content">
                {{CONTENT}}
            </div>
        </article>
    </div>
</body>
</html>
