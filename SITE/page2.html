<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ракурс NEWS — Страница 2</title>
<link rel="icon" type="image/png" href="images/logo.png" />
<link rel="apple-touch-icon" sizes="180x180" href="images/logo.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://rakurs-news.github.io/rakurs-news/page2.html" />
<meta property="og:title" content="Ракурс NEWS | Страница 2" />
<meta property="og:description" content="Свежие новости с иронией. Вся правда в иронии" />
<meta property="og:image" content="images/logo.png" /> 
<meta name="description" content="Ракурс NEWS: Ироничный взгляд на главные новости политики, общества и мира. Раскрываем правду через сарказм и острый анализ" />
<link rel="stylesheet" href="style.css" />

<style>
/* Встроенные стили для карточек и элементов */
.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
}
.news-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
  display: flex;
  flex-direction: column;
}
.news-image {
  width: 100%;
  height: 180px;
  object-fit: cover;
}
.news-content {
  padding: 10px;
  flex: 1;
}
.news-title {
  font-size: 18px;
  margin: 8px 0;
}
.news-description {
  font-size: 14px;
  color: #555;
}
.news-category {
  margin: 8px 0;
}
.pagination-wrapper {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 20px 0;
}
.pagination-btn {
  padding: 8px 12px;
  border: none;
  border-radius: 4px;
  background-color: #eee;
  cursor: pointer;
}
.pagination-btn.active {
  background-color: #007bff;
  color: #fff;
}
</style>
</head>
<body>

<h1 style="display:none;">Новости Ракурс NEWS — Страница 2</h1>

<header>
  <!-- Тут можно оставить существующий хедер или добавить свой -->
</header>

<!-- Контейнер для новостей -->
<div id="newsContainer" class="news-grid"></div>

<!-- Пагинация -->
<div id="pagination" class="pagination-wrapper"></div>

<!-- Скрипт загрузки и отображения новостей -->
<script>
const newsData = [
  // Вставьте сюда массив с объектами новостей, как в вашем JSON, или загрузите их через fetch
  // Для этого примера используем встроенный массив, скопированный из данных
  {
    "id": "news-12",
    "title": "Американская индустрия клонирует украинский Magura",
    "category": "Геополитика",
    "date": "2026-07-22",
    "description": "Производство дронов Magura переносится на мощности США.",
    "content": "...",
    "image": "/images/IMG_20260722_111859.webp",
    "author": "Дмитрий Мусиенко",
    "tags": ["США","Magura","дроны","ReconCraft","производство"]
  },
  // Добавьте остальные новости сюда (или загрузите через fetch)
  // Для краткости — только одна новость, остальные нужно скопировать из вашего JSON
];

// Переменные
let filteredNews = [...newsData]; // для фильтрации
let currentPage = getCurrentPage();
const itemsPerPage = 10;

// Получение текущей страницы из URL
function getCurrentPage() {
  const match = window.location.pathname.match(/page(\d+)\.html$/);
  return match ? parseInt(match[1], 10) : 1;
}

// Функция отображения новостей
function renderNews() {
  const container = document.getElementById('newsContainer');
  container.innerHTML = '';

  const start = (currentPage - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = filteredNews.slice(start, end);

  if (pageItems.length === 0) {
    container.innerHTML = '<p>Нет новостей для отображения.</p>';
    return;
  }

  pageItems.forEach(news => {
    const card = document.createElement('div');
    card.className = 'news-card';

    card.innerHTML = `
      <img src="${news.image}" alt="${news.title}" class="news-image" />
      <div class="news-content">
        <div class="news-category badge category-${news.category.toLowerCase().replace(/\s+/g, '-')}">${news.category}</div>
        <h2 class="news-title">${news.title}</h2>
        <p class="news-description">${news.description}</p>
        <p><small>${news.date}</small></p>
      </div>
    `;
    container.appendChild(card);
  });
}

// Функция рендера пагинации
function renderPagination() {
  const container = document.getElementById('pagination');
  container.innerHTML = '';

  const totalPages = Math.ceil(filteredNews.length / itemsPerPage);

  // Предыдущая
  const prevBtn = document.createElement('button');
  prevBtn.className = 'pagination-btn';
  prevBtn.textContent = '«';
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => {
    if (currentPage > 1) {
      currentPage--;
      updatePage();
    }
  };
  container.appendChild(prevBtn);

  // Страницы
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement('button');
    btn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => {
      currentPage = i;
      updatePage();
    };
    container.appendChild(btn);
  }

  // Следующая
  const nextBtn = document.createElement('button');
  nextBtn.className = 'pagination-btn';
  nextBtn.textContent = '»';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => {
    if (currentPage < totalPages) {
      currentPage++;
      updatePage();
    }
  };
  container.appendChild(nextBtn);
}

function updatePage() {
  renderNews();
  renderPagination();
  // Обновляем URL, если нужно
  // history.pushState(null, '', `/page${currentPage}.html`);
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
  renderNews();
  renderPagination();

  // Можно добавить фильтр по категориям и поиску
  // Например, обработчики для кнопок категорий
});
</script>

</body>
</html>
