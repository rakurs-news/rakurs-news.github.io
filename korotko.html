<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коротко — Ракурс News</title>
  <meta name="description" content="Короткие новости Ракурс News — оперативные заметки дня">
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#17191e; --bg-row:#1d2027; --text:#e6e7ea; --dim:#8f929c; --accent:#d63a2f; --line:#2c3038; --serif:'PT Serif',Georgia,serif; --sans:'PT Sans',Arial,sans-serif; --mono:'JetBrains Mono',monospace; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.6; }
    .header { position:sticky; top:0; z-index:200; height:60px; width:100%; background:var(--bg); border-bottom:3px solid var(--accent); }
    .header-inner { max-width:1160px; height:100%; margin:0 auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; position:relative; }
    .logo img { max-height:36px; width:auto; }
    .brand { position:absolute; left:50%; transform:translateX(-50%); font-family:var(--serif); font-weight:700; font-size:21px; letter-spacing:0.02em; white-space:nowrap; }
    .brand em { font-style:normal; color:var(--accent); }
    .header-clock { font-family:var(--mono); font-size:13px; color:var(--dim); letter-spacing:0.04em; }
    .page { max-width:680px; margin:0 auto; padding:24px 16px 48px; }
    .page-title { font-family:var(--serif); font-size:28px; color:#fff; margin-bottom:4px; }
    .page-sub { color:var(--dim); font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:24px; }
    .post { background:var(--bg-row); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
    .post-time { font-family:var(--mono); font-size:12px; color:var(--accent); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
    .post-body p { font-size:16px; line-height:1.65; margin-bottom:12px; }
    .post-body p:last-child { margin-bottom:0; }
    .ph { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:14px; }
    .ph.one { grid-template-columns:1fr; }
    .ph img { width:100%; border-radius:6px; cursor:pointer; display:block; }
    .vid { margin-top:14px; border-radius:6px; overflow:hidden; }
    .vid iframe { width:100%; aspect-ratio:16/9; border:0; display:block; }
    .footer { border-top:3px solid var(--accent); background:var(--bg-row); padding:30px 16px; text-align:center; color:var(--dim); font-size:13px; }
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:100000; cursor:pointer; }
    .lightbox img { max-width:96%; max-height:96%; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo"><img src="/img/logo.png" alt="Ракурс News" width="100" height="30"></a>
      <div class="brand">РАКУРС <em>NEWS</em></div>
      <div class="header-clock"></div>
    </div>
  </header>

  <main class="page">
    <h1 class="page-title">Коротко</h1>
    <div class="page-sub">Оперативные заметки дня</div>
    <div id="feed"></div>
  </main>

  <footer class="footer">© 2026 Ракурс News — Актуальные новости России и мира</footer>

  <div class="lightbox" id="lb"><img alt=""></div>

  <script src="/posts-data.js"></script>
  <script>
  (function () {
    // часы в шапке
    function tick() {
      var d = new Date(), p = function (x) { return String(x).padStart(2,'0'); };
      document.querySelector('.header-clock').textContent =
        p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + ' МСК';
    }
    tick(); setInterval(tick, 1000);

    if (typeof posts === 'undefined') return;
    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    document.getElementById('feed').innerHTML = posts.map(function (p) {
      var photos = p.photos || [];
      var gal = photos.length
        ? '<div class="ph' + (photos.length === 1 ? ' one' : '') + '">' +
          photos.map(function (s) { return '<img loading="lazy" src="' + s + '" alt="">'; }).join('') + '</div>'
        : '';
      var vid = p.video
        ? '<div class="vid"><iframe src="' + p.video + '" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen frameborder="0" loading="lazy"></iframe></div>'
        : '';
      var body = (p.text || '').split(/\n\n+/).map(function (par) {
        return '<p>' + esc(par).replace(/\n/g, '<br>') + '</p>';
      }).join('');
      return '<div class="post"><div class="post-time">' + esc(p.time) + '</div>' +
             '<div class="post-body">' + body + '</div>' + gal + vid + '</div>';
    }).join('');

    // лайтбокс: клик по фото — на весь экран
    var lb = document.getElementById('lb');
    document.getElementById('feed').addEventListener('click', function (e) {
      if (e.target.tagName === 'IMG') {
        lb.querySelector('img').src = e.target.src;
        lb.style.display = 'flex';
      }
    });
    lb.addEventListener('click', function () { lb.style.display = 'none'; });
  })();
  </script>
</body>
</html>
